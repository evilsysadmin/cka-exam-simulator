[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cka-exam-simulator"
version = "0.2.0"
description = "Local-first hands-on Kubernetes CKA exam simulator"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cka-sim = "cka_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  scenario-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m cka_sim validate-bank
      - name: Verify Makefile commands are parseable without starting Docker
        run: |
          make -n ollama-up
          make -n scenario-generate COUNT=2
          make -n scenario-generate PROVIDER=workers-ai COUNT=2
          make -n scenario-audit
          make -n scenario-batch PROVIDER=workers-ai COUNT=2
          make -n scenario-verify
          make -n scenario-review-queue
          make -n scenario-prepare-review SLUG=example SHA256=placeholder REVIEWER=operator
          make -n scenario-validate PROPOSAL=scenarios/generated/sample.yaml
          make -n scenario-smoke PROPOSAL=scenarios/generated/sample.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Install until a generated package-lock is committed; then move to npm ci.
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:public
        working-directory: frontend
      - run: npm run test:public
        working-directory: frontend

  kind-smoke:
    name: Live Kubernetes scenario smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scenario engine
        run: python -m pip install -e '.[dev]'
      - name: Install pinned kind and kubectl without creating a cluster
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.35.0
      - name: Create dedicated ephemeral lab through our CLI
        run: python -m cka_sim lab-up
      - name: Prove every curated scenario starts broken and can be solved
        run: |
          python -m cka_sim lab-smoke scale-payment-api
          python -m cka_sim lab-smoke fix-catalog-service
          python -m cka_sim lab-smoke recover-scheduler-capacity
      - name: Smoke a quarantined generated proposal through the verification gate
        run: |
          python - <<'PY'
          import json
          from cka_sim.catalog import load_bank, save_generated
          from cka_sim.models import Scenario
          source = load_bank()["scale-payment-api"].model_dump(mode="json")
          source.update(slug="ci-generated-scale", namespace="cka-ci-generated-scale",
                        story="Live cluster check for fresh workloads before capacity peaks.")
          save_generated(Scenario.model_validate_json(json.dumps(source)))
          PY
          python -m cka_sim verify-proposals
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".local/proposal-verification.json").read_text())
          assert report["passed"] and report["verified"] == 1
          assert report["requires_human_review"] is True
          assert report["entries"][0]["status"] == "needs-human-review"
          assert not Path("scenarios/ci-generated-scale.json").exists()
          PY
      - name: Review verified proposal in read-only queue
        run: |
          python -m cka_sim review-queue > .local/review-queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          queue = json.loads(Path(".local/review-queue.json").read_text())
          assert queue["ready"] == 1
          assert queue["entries"][0]["status"] == "needs-human-review"
          assert not Path("scenarios/ci-generated-scale.json").exists()
          PY
      - name: Print cluster diagnostics if smoke fails
        if: failure()
        run: |
          if test -f .local/kubeconfig; then
            kubectl --kubeconfig .local/kubeconfig --context kind-cka-dev get deployments,pods,services,endpointslices -A -o wide || true
            kubectl --kubeconfig .local/kubeconfig --context kind-cka-dev get events -A --sort-by=.metadata.creationTimestamp | tail -80 || true
          fi
      - name: Delete ephemeral lab
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            python -m cka_sim lab-down
          fi

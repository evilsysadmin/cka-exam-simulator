name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  scenario-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Install real editor for isolated PTY tests
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends nano
      - run: python -m pytest
      - run: python -m cka_sim validate-bank
      - name: OCI factory dry run without secrets or inference
        env:
          CLOUDFLARE_ACCOUNT_ID: ''
          CLOUDFLARE_API_TOKEN: ''
          CKA_SCENARIO_PROVIDER: workers-ai
        run: |
          mkdir -p .local
          python -m cka_sim factory-run > .local/factory-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('.local/factory-plan.json').read_text())
          assert plan['status'] == 'dry-run'
          assert plan['provider'] == 'workers-ai'
          assert plan['generated'] == []
          assert not Path('.local/factory-budget.json').exists()
          assert not Path('scenarios/generated').exists()
          PY
      - name: Assert preprovisioned staging workspace never writes to source
        env:
          CLOUDFLARE_ACCOUNT_ID: ''
          CLOUDFLARE_API_TOKEN: ''
          CKA_SCENARIO_PROVIDER: workers-ai
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory(prefix="cka-factory-staging-") as data_root:
              plan = json.loads(subprocess.check_output([
                  sys.executable, "-m", "cka_sim", "factory-run",
                  "--workspace", data_root, "--count", "1",
              ], text=True))
              workspace = Path(data_root)
              assert plan["status"] == "dry-run"
              assert plan["generated"] == []
              assert (workspace / ".local/factory.lock").exists()
              assert not (workspace / ".local/factory-budget.json").exists()
              assert not (workspace / "scenarios/generated").exists()
              assert not Path("scenarios/generated").exists()
          PY
      - name: Verify noneditable wheel with external readonly curated bank
        env:
          CLOUDFLARE_ACCOUNT_ID: ''
          CLOUDFLARE_API_TOKEN: ''
          CKA_SCENARIO_PROVIDER: workers-ai
        run: |
          set -euo pipefail
          python -m venv --copies "$RUNNER_TEMP/cka-wheel-runtime"
          "$RUNNER_TEMP/cka-wheel-runtime/bin/python" -m pip install --disable-pip-version-check .
          mkdir -p "$RUNNER_TEMP/cka-wheel-workspace"
          export CKA_SCENARIO_SOURCE_ROOT="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/cka-wheel-runtime/bin/python" -I -m cka_sim validate-bank
          "$RUNNER_TEMP/cka-wheel-runtime/bin/python" -I -m cka_sim factory-run \
            --workspace "$RUNNER_TEMP/cka-wheel-workspace" \
            > "$RUNNER_TEMP/cka-wheel-plan.json"
          "$RUNNER_TEMP/cka-wheel-runtime/bin/python" -I - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          from cka_sim.catalog import ROOT, load_bank
          runtime = Path(os.environ["RUNNER_TEMP"]) / "cka-wheel-runtime"
          origin = Path(importlib.util.find_spec("cka_sim").origin).resolve()
          assert origin.is_relative_to(runtime / "lib"), origin
          assert ROOT == Path(os.environ["GITHUB_WORKSPACE"])
          assert len(load_bank()) >= 3
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cka-wheel-plan.json").read_text())
          assert plan["status"] == "dry-run" and plan["generated"] == []
          workspace = Path(os.environ["RUNNER_TEMP"]) / "cka-wheel-workspace"
          assert not (workspace / ".local/factory-budget.json").exists()
          assert not (workspace / "scenarios/generated").exists()
          assert not (ROOT / "scenarios/generated").exists()
          PY
      - name: Verify Makefile commands are parseable without starting Docker
        run: |
          make -n ollama-up
          make -n scenario-generate COUNT=2
          make -n factory-plan
          make -n factory-plan FACTORY_WORKSPACE=/var/lib/shadowops/cka-factory-staging
          make -n factory-execute COUNT=2
          make -n scenario-generate PROVIDER=workers-ai COUNT=2
          make -n scenario-audit
          make -n scenario-batch PROVIDER=workers-ai COUNT=2
          make -n scenario-verify
          make -n scenario-review-queue
          make -n scenario-prepare-review SLUG=example SHA256=placeholder REVIEWER=operator
          make -n scenario-pr-bundle SLUG=example
          make -n scenario-smoke-all
          make -n scenario-validate PROPOSAL=scenarios/generated/sample.yaml
          make -n scenario-smoke PROPOSAL=scenarios/generated/sample.yaml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Install until a generated package-lock is committed; then move to npm ci.
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:public
        working-directory: frontend
      - run: npm run test:public
        working-directory: frontend

      - run: npm run test:account
        working-directory: frontend
      - run: npm run build:account-staging
        working-directory: frontend
      - run: npm run test:labs
        working-directory: frontend
      - run: npm run build:lab-staging
        working-directory: frontend
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Install pinned account browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real account UI at desktop and touch sizes (synthetic service responses)
        working-directory: frontend
        run: npm run test:account-browser
      - name: Real staging lab UI at desktop and touch sizes (synthetic HTTP services)
        working-directory: frontend
        run: npm run test:labs-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cka-account-ui-${{ github.sha }}
          path: |
            frontend/account-captures/
            frontend/lab-captures/
          if-no-files-found: error

  kind-smoke:
    name: Live Kubernetes scenario smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scenario engine
        run: python -m pip install -e '.[dev]'
      - name: Install pinned kind and kubectl without creating a cluster
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.35.0
      - name: Create dedicated ephemeral lab through our CLI
        run: python -m cka_sim lab-up
      - name: Prove every curated scenario starts broken and can be solved
        run: |
          python -m cka_sim lab-smoke-all
      - name: Smoke a quarantined generated proposal through the verification gate
        run: |
          python - <<'PY'
          import json
          from cka_sim.catalog import load_bank, save_generated
          from cka_sim.models import Scenario
          source = load_bank()["scale-payment-api"].model_dump(mode="json")
          source.update(slug="ci-generated-scale", namespace="cka-ci-generated-scale",
                        story="Live cluster check for fresh workloads before capacity peaks.")
          save_generated(Scenario.model_validate_json(json.dumps(source)))
          PY
          python -m cka_sim verify-proposals
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(".local/proposal-verification.json").read_text())
          assert report["passed"] and report["verified"] == 1
          assert report["requires_human_review"] is True
          assert report["entries"][0]["status"] == "needs-human-review"
          assert not Path("scenarios/ci-generated-scale.json").exists()
          PY
      - name: Review verified proposal in read-only queue
        run: |
          python -m cka_sim review-queue > .local/review-queue.json
          python - <<'PY'
          import json
          from pathlib import Path
          queue = json.loads(Path(".local/review-queue.json").read_text())
          assert queue["ready"] == 1
          assert queue["entries"][0]["status"] == "needs-human-review"
          assert not Path("scenarios/ci-generated-scale.json").exists()
          PY
      - name: Install Go toolchain for dedicated kind read-only observer
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - name: Compile Go read-only observer and prove live-kind parity
        run: |
          set -euo pipefail
          cd go
          go mod download
          go mod verify
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/cka-observe" ./cmd/cka-observe
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/cka-lease-stdio" ./cmd/cka-lease-stdio
          cd ..
          python scripts/check_go_live_observer.py "$RUNNER_TEMP/cka-observe"
      - name: Prove journal leases, candidate RBAC, restricted admission and verified cleanup
        run: python scripts/check_leased_live_cluster.py "$RUNNER_TEMP/cka-lease-stdio"
      - name: Print cluster diagnostics if smoke fails
        if: failure()
        run: |
          if test -f .local/kubeconfig; then
            kubectl --kubeconfig .local/kubeconfig --context kind-cka-dev get deployments,pods,services,endpointslices -A -o wide || true
            kubectl --kubeconfig .local/kubeconfig --context kind-cka-dev get events -A --sort-by=.metadata.creationTimestamp | tail -80 || true
          fi
      - name: Delete ephemeral lab
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            python -m cka_sim lab-down
          fi

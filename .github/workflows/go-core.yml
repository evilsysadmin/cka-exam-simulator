name: Go scenario contract
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-scenario-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - name: Resolve verified client-go module graph
        run: go mod tidy
      - name: Test trusted JSON scenarios and reject untrusted fields
        run: go test -race -count=1 ./...
      - name: Static Go analysis
        run: go vet ./...
      - name: Prove parity for existing curated JSON bank (no Kubernetes)
        run: |
          set -euo pipefail
          expected='CKA_GO_BANK_VALID scenarios=3'
          actual="$(go run ./cmd/cka-scenarios -bank ../scenarios)"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove identical Go/Python grading for curated Kubernetes snapshots
        run: |
          set -euo pipefail
          go run ./cmd/cka-grade -bank ../scenarios \
            -fixtures testdata/grading-cases.json \
            > "$RUNNER_TEMP/cka-go-grading-report.json"
          python -m pip install --disable-pip-version-check -e ..
          python ../scripts/check_go_grading_parity.py \
            --fixtures testdata/grading-cases.json \
            --go-report "$RUNNER_TEMP/cka-go-grading-report.json" \
            --bank ../scenarios
      - name: Prove candidate-safe Go JSON matches Python and contains no private fields
        run: |
          set -euo pipefail
          go run ./cmd/cka-candidate-views -bank ../scenarios \
            > "$RUNNER_TEMP/cka-go-candidate-views.json"
          python ../scripts/check_go_candidate_parity.py \
            --bank ../scenarios \
            --go-report "$RUNNER_TEMP/cka-go-candidate-views.json"
      - name: Compile the same validator for Linux ARM64 / OCI A1
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cka-go"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -o "$RUNNER_TEMP/cka-go/cka-scenarios-linux-arm64" \
            ./cmd/cka-scenarios
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -o "$RUNNER_TEMP/cka-go/cka-grade-linux-arm64" \
            ./cmd/cka-grade
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -o "$RUNNER_TEMP/cka-go/cka-candidate-views-linux-arm64" \
            ./cmd/cka-candidate-views
          file "$RUNNER_TEMP/cka-go/cka-candidate-views-linux-arm64" | grep -E 'ARM aarch64|ARM64|aarch64'
          file "$RUNNER_TEMP/cka-go/cka-scenarios-linux-arm64" | grep -E 'ARM aarch64|ARM64|aarch64'
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -o "$RUNNER_TEMP/cka-go/cka-observe-linux-arm64" \
            ./cmd/cka-observe
          file "$RUNNER_TEMP/cka-go/cka-observe-linux-arm64" | grep -E 'ARM aarch64|ARM64|aarch64'
          file "$RUNNER_TEMP/cka-go/cka-grade-linux-arm64" | grep -E 'ARM aarch64|ARM64|aarch64'

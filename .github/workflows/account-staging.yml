name: CKA account staging
on:
  pull_request:
    paths: ['backend/cka_sim/account_api.py', 'backend/cka_sim/identity*.py', 'backend/tests/test_account_api.py', 'deploy/**', '.github/workflows/account-staging.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account:
    name: Isolated account API and pinned runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r deploy/account-requirements.txt pytest
      - name: Verify signature, live freshness, CORS and lab separation
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_account_api.py backend/tests/test_identity_freshness.py
      - name: Audit pinned account runtime dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict -r deploy/account-requirements.txt
      - name: Build isolated account image
        run: docker build -f deploy/Dockerfile.account --build-arg SOURCE_SHA="$GITHUB_SHA" -t cka-account-ci .
      - name: Prove privileged application modules are absent
        run: |
          docker run --rm --read-only --network none --entrypoint python cka-account-ci -c "import importlib.util; from cka_sim.account_api import create_account_app; assert all(importlib.util.find_spec('cka_sim.'+n) is None for n in ['api','kube','factory','session']); print('CKA_ACCOUNT_IMAGE_ISOLATION_OK')"
  publish:
    name: Publish signed account image for Infra handoff
    needs: account
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'evilsysadmin/cka-exam-simulator'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Require current source main
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/evilsysadmin/cka-exam-simulator/commits/main --jq .sha)" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: deploy/Dockerfile.account
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/evilsysadmin/cka-account-staging:sha-${{ github.sha }}
          build-args: SOURCE_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/evilsysadmin/cka-account-staging
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

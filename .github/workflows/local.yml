name: Local workstation labs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: One-command local startup, verified real nano and owned kind
        run: make up
      - name: Real Kubernetes ownership, solve, grade and cleanup
        run: python3 scripts/check_local.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Local browser against the actual API
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/local-browser.mjs
      - name: Stop only the owned local lab
        if: always()
        run: |
          make logs
          make down

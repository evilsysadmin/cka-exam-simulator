name: Local workstation labs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Avoid rebuilding Docker/owned kind for superseded revisions of the same PR.
# Every admitted main SHA must complete its own real local workstation gate.
concurrency:
  group: cka-local-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: One-command local startup, verified real nano and owned kind
        run: make up
      - name: Real Kubernetes ownership, solve, grade and cleanup
        run: python3 scripts/check_local.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Local browser against the actual API
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tests/local-browser.mjs
      - name: Stop only the owned local lab
        if: always()
        run: |
          make logs
          make down
